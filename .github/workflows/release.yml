name: Release

# Build release packages on v* tags (or manually) so target machines can
# install prebuilt artifacts with scripts/install.sh instead of compiling
# Go / Node on the box. Each package is assembled by
# scripts/package-release.sh — the same script used for local builds:
#
#   dhtsearch-<version>-linux-<arch>.tar.gz        (+ .sha256)
#     dhtsearch-server   Go binary for that arch
#     web/               Next.js standalone build (arch-independent)
#     env.example, install.sh, LICENSE, README.md
#
# The web build is arch-independent, so it is built once and combined with
# each per-arch server binary in the package job.
#
# This workflow is also reusable (workflow_call): the Auto Release
# workflow (.github/workflows/auto-release.yml) calls it after pushing a
# version tag for a business-code push to main, because a tag pushed with
# GITHUB_TOKEN would not trigger this workflow on its own. Callers pass
# the version explicitly and set publish=true to attach the packages to
# that tag's GitHub Release.
#
# Manual runs (workflow_dispatch) build artifacts only by default. Set
# the dispatch-only publish input to true to also create a GitHub
# Release: the version is the given version input, or — when that is
# empty — the next version from scripts/next-version.sh (greatest
# vX.Y.Z tag, patch + 1; v0.1.0 when there are no tags yet).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the packages (default: dev-<short sha>; with publish, the next version)"
        required: false
        type: string
      publish:
        description: "Also create a GitHub Release for the version (default: artifacts only)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version label for the packages"
        required: true
        type: string
      publish:
        description: "Attach the packages to a GitHub Release for the version tag"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  web:
    name: Build web (standalone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        # Baked into the bundle; the Next server fetches the API
        # server-side, and install.sh runs the API on 127.0.0.1:8080.
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8080
        run: npm run build
      - name: Stage standalone output
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p web-dist/web
          cp -R web/.next/standalone/. web-dist/web/
          mkdir -p web-dist/web/.next
          cp -R web/.next/static web-dist/web/.next/static
          cp -R web/public web-dist/web/public
          test -f web-dist/web/server.js
          # The standalone server cannot start without these; fail here
          # rather than shipping a package whose web frontend crash-loops.
          test -f web-dist/web/.next/BUILD_ID
          test -f web-dist/web/.next/required-server-files.json
      - name: Pack web dist as tarball
        working-directory: ${{ github.workspace }}
        # actions/upload-artifact >= 4.4 silently drops hidden files
        # (anything under a dot-directory) unless include-hidden-files
        # is set — that is how web/.next vanished from the v0.1.0 and
        # v0.1.1 packages. Hand the artifact layer a single tar file
        # instead: tar does not filter dotfiles. include-hidden-files
        # stays on as a second line of defence.
        run: tar -czf web-dist.tar.gz -C web-dist web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          include-hidden-files: true

  server:
    name: Build server (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "${{ github.workspace }}/server-dist/dhtsearch-server-${{ matrix.arch }}" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: server-dist

  package:
    name: Package (${{ matrix.arch }})
    needs: [web, server]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      # fetch-depth 0 + fetch-tags: the Resolve version step below may
      # need the full tag list (scripts/next-version.sh). Only this job
      # resolves versions, so only this job pays for the full fetch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Unpack web dist tarball
        # The web job ships web/ as a tarball so the artifact layer
        # cannot filter out the .next directory (see the web job).
        run: |
          tar -xzf web-dist/web-dist.tar.gz -C web-dist
          test -f web-dist/web/server.js
          test -f web-dist/web/.next/BUILD_ID
          test -f web-dist/web/.next/required-server-files.json
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: server-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            # Publishing without an explicit version (manual dispatch):
            # bump the greatest vX.Y.Z tag, or start at v0.1.0.
            echo "version=$(git tag -l | scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble tarball + sha256
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          pkg="dhtsearch-${version}-linux-${{ matrix.arch }}"
          stage="$RUNNER_TEMP/$pkg"
          mkdir -p "$stage"
          install -m 0755 "server-dist/dhtsearch-server-${{ matrix.arch }}" "$stage/dhtsearch-server"
          cp -R web-dist/web "$stage/web"
          # Hard fail on an incomplete web build: without .next the
          # installed frontend crash-loops (this shipped in v0.1.0/v0.1.1).
          test -f "$stage/web/.next/BUILD_ID" || { echo "web/.next/BUILD_ID missing from package" >&2; exit 1; }
          test -f "$stage/web/.next/required-server-files.json" || { echo "web/.next/required-server-files.json missing from package" >&2; exit 1; }
          cp env.example "$stage/env.example"
          cp scripts/install.sh "$stage/install.sh"
          chmod 755 "$stage/install.sh"
          cp LICENSE README.md "$stage/"
          mkdir -p dist
          tar -czf "dist/$pkg.tar.gz" -C "$RUNNER_TEMP" "$pkg"
          (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
          ls -lh dist
      - name: Smoke test the packaged web frontend
        # Unpack the exact tarball that is about to be published and
        # prove the bundled Next.js server starts and serves the
        # homepage. The API is not running here; the homepage renders
        # with empty stats in that case, so a 200 still proves the
        # standalone build (including .next) is intact.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          pkg="dhtsearch-${version}-linux-${{ matrix.arch }}"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/$pkg.tar.gz" -C "$smoke"
          test -f "$smoke/$pkg/web/.next/BUILD_ID"
          test -f "$smoke/$pkg/web/.next/required-server-files.json"
          cd "$smoke/$pkg/web"
          PORT=3100 HOSTNAME=127.0.0.1 node server.js > "$RUNNER_TEMP/web-smoke.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3100/"; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "packaged web frontend did not answer on /; server log:" >&2
            cat "$RUNNER_TEMP/web-smoke.log" >&2
            exit 1
          fi
          echo "smoke OK: packaged web frontend serves / with HTTP 200"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: dist
      - name: Attach to GitHub Release
        # Tag pushes publish as before. Reusable-workflow calls run on a
        # branch ref, so they publish via the explicit publish input and
        # pin tag_name to the resolved version instead of the ref name.
        # Manual dispatch reaches here only with publish=true.
        #
        # When the tag does not exist yet (manual dispatch with a fresh
        # version), the release action creates it via the GitHub API.
        # Without target_commitish that new tag would point at the
        # default branch's current HEAD, which may have moved past the
        # commit this run was dispatched from — so pin it to this run's
        # commit. When the tag already exists (tag pushes, auto-release
        # calls) target_commitish is ignored by the API.
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
